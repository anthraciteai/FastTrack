services:
  ollama:
    image: ollama/ollama:latest
    container_name: fasttrack-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: fasttrack-ollama-pull
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:1b"]
    restart: "no"

volumes:
  ollama:
